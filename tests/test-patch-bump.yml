name: Test patch bump with increment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up tag and fix commits
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "ORIG_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git tag -d acttest-patch-v1.2.3 2>/dev/null || true
          git tag acttest-patch-v1.2.3
          git commit --allow-empty -m "fix: first fix"
          git commit --allow-empty -m "fix: second fix"
      - id: action
        uses: .
        with:
          tag_prefix: acttest-patch-v
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
          VTYPE: ${{ steps.action.outputs.version_type }}
          INCREMENT: ${{ steps.action.outputs.increment }}
          CHANGED: ${{ steps.action.outputs.changed }}
        run: |
          echo "version=$VERSION type=$VTYPE increment=$INCREMENT changed=$CHANGED"
          fail=0
          [ "$VERSION" = "1.2.4" ] || { echo "FAIL: version expected 1.2.4"; fail=1; }
          [ "$VTYPE" = "patch" ] || { echo "FAIL: version_type expected patch"; fail=1; }
          [ "$INCREMENT" = "1" ] || { echo "FAIL: increment expected 1"; fail=1; }
          [ "$CHANGED" = "true" ] || { echo "FAIL: changed expected true"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "PASS"
      - name: Cleanup
        if: always()
        run: |
          git tag -d acttest-patch-v1.2.3 2>/dev/null || true
          if [ -n "$ORIG_SHA" ]; then git reset --soft "$ORIG_SHA"; fi
