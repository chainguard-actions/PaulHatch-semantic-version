name: Test custom major/minor string patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create base tag and custom-marked commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag -a tcustv1.0.0 -m "base" HEAD
          git commit --allow-empty -m "feat!: would be major by default"
          git commit --allow-empty -m "(MINOR) add something"
      - id: action
        uses: .
        with:
          tag_prefix: tcustv
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
          VERSION_TYPE: ${{ steps.action.outputs.version_type }}
        run: |
          echo "version=$VERSION type=$VERSION_TYPE"
          [ "$VERSION" = "1.1.0" ] || { echo "FAIL: version expected 1.1.0"; exit 1; }
          [ "$VERSION_TYPE" = "minor" ] || { echo "FAIL: version_type expected minor"; exit 1; }
          echo "PASS"
