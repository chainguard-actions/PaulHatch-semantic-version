name: Test enable_prerelease_mode keeps major at 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up 0.x tag and breaking commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "ORIG_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git tag -d acttest-pre-v0.4.2 2>/dev/null || true
          git tag acttest-pre-v0.4.2
          git commit --allow-empty -m "feat!: breaking change"
      - id: action
        uses: .
        with:
          tag_prefix: acttest-pre-v
          enable_prerelease_mode: "true"
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
          VTYPE: ${{ steps.action.outputs.version_type }}
        run: |
          echo "version=$VERSION type=$VTYPE"
          fail=0
          [ "$VERSION" = "0.5.0" ] || { echo "FAIL: version expected 0.5.0"; fail=1; }
          [ "$VTYPE" = "major" ] || { echo "FAIL: version_type expected major (unchanged by prerelease mode)"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "PASS"
      - name: Cleanup
        if: always()
        run: |
          git tag -d acttest-pre-v0.4.2 2>/dev/null || true
          if [ -n "$ORIG_SHA" ]; then git reset --soft "$ORIG_SHA"; fi
