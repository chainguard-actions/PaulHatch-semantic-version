name: Test major bump from breaking commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git history
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "ORIG_REF=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_ENV"
          echo "ORIG_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout -B acttest-branch
          git commit --allow-empty -m "chore: base"
          git tag acttest-v1.2.3
          git commit --allow-empty -m "feat: something"
          git commit --allow-empty -m "feat!: drop old api"
      - id: action
        uses: .
        with:
          tag_prefix: acttest-v
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
          TYPE: ${{ steps.action.outputs.version_type }}
          MAJOR: ${{ steps.action.outputs.major }}
        run: |
          echo "version=$VERSION type=$TYPE major=$MAJOR"
          if [ "$VERSION" != "2.0.0" ]; then echo "FAIL: expected 2.0.0"; exit 1; fi
          if [ "$TYPE" != "major" ]; then echo "FAIL: expected major"; exit 1; fi
          if [ "$MAJOR" != "2" ]; then echo "FAIL: expected major 2"; exit 1; fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: |
          if [ -n "$ORIG_REF" ] && [ "$ORIG_REF" != "HEAD" ]; then git checkout -f "$ORIG_REF"; elif [ -n "$ORIG_SHA" ]; then git checkout -f "$ORIG_SHA"; fi
          git branch -D acttest-branch || true
          git tag -l 'acttest-*' | xargs -r git tag -d || true
