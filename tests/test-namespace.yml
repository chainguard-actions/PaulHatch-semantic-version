name: Test namespaced version tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up namespaced tags and commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "ORIG_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git tag -d acttest-ns-v2.0.0-mycomp acttest-ns-v5.0.0-othercomp 2>/dev/null || true
          git tag acttest-ns-v2.0.0-mycomp
          git tag acttest-ns-v5.0.0-othercomp
          git commit --allow-empty -m "feat: component feature"
      - id: action
        uses: .
        with:
          tag_prefix: acttest-ns-v
          namespace: mycomp
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
          VTAG: ${{ steps.action.outputs.version_tag }}
        run: |
          echo "version=$VERSION tag=$VTAG"
          fail=0
          [ "$VERSION" = "2.1.0" ] || { echo "FAIL: version expected 2.1.0"; fail=1; }
          [ "$VTAG" = "acttest-ns-v2.1.0-mycomp" ] || { echo "FAIL: version_tag expected acttest-ns-v2.1.0-mycomp"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "PASS"
      - name: Cleanup
        if: always()
        run: |
          git tag -d acttest-ns-v2.0.0-mycomp acttest-ns-v5.0.0-othercomp 2>/dev/null || true
          if [ -n "$ORIG_SHA" ]; then git reset --soft "$ORIG_SHA"; fi
