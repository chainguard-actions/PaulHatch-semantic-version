name: Test namespace sub-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git history
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "ORIG_REF=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_ENV"
          echo "ORIG_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout -B acttest-branch
          git commit --allow-empty -m "chore: base"
          git tag acttest-v1.2.3-ns1
          git commit --allow-empty -m "chore: other"
          git tag acttest-v9.0.0
          git commit --allow-empty -m "fix: a bug"
      - id: action
        uses: .
        with:
          tag_prefix: acttest-v
          namespace: ns1
      - name: Assert outputs
        env:
          MAJOR: ${{ steps.action.outputs.major }}
          MINOR: ${{ steps.action.outputs.minor }}
          PATCH: ${{ steps.action.outputs.patch }}
          VERSION: ${{ steps.action.outputs.version }}
          TAG: ${{ steps.action.outputs.version_tag }}
        run: |
          echo "major=$MAJOR minor=$MINOR patch=$PATCH version=$VERSION tag=$TAG"
          if [ "$MAJOR.$MINOR.$PATCH" != "1.2.4" ]; then echo "FAIL: expected 1.2.4 (non-namespaced tag must be ignored)"; exit 1; fi
          if [ "$TAG" != "acttest-v1.2.4-ns1" ]; then echo "FAIL: expected version_tag acttest-v1.2.4-ns1"; exit 1; fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: |
          if [ -n "$ORIG_REF" ] && [ "$ORIG_REF" != "HEAD" ]; then git checkout -f "$ORIG_REF"; elif [ -n "$ORIG_SHA" ]; then git checkout -f "$ORIG_SHA"; fi
          git branch -D acttest-branch || true
          git tag -l 'acttest-*' | xargs -r git tag -d || true
