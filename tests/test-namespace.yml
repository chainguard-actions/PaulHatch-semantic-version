name: Test namespace sub-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create namespaced base tag and a fix commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag -a tnsv1.0.0-mylib -m "base" HEAD
          git commit --allow-empty -m "fix: lib fix"
      - id: action
        uses: .
        with:
          tag_prefix: tnsv
          namespace: mylib
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
          VERSION_TAG: ${{ steps.action.outputs.version_tag }}
        run: |
          echo "version=$VERSION tag=$VERSION_TAG"
          [ "$VERSION" = "1.0.1" ] || { echo "FAIL: version expected 1.0.1"; exit 1; }
          [ "$VERSION_TAG" = "tnsv1.0.1-mylib" ] || { echo "FAIL: version_tag expected tnsv1.0.1-mylib"; exit 1; }
          echo "PASS"
