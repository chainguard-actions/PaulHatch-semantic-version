name: Test search_commit_body finds breaking change in body
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create base tag and commit with breaking body
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag -a tbodyv1.0.0 -m "base" HEAD
          git commit --allow-empty -m "chore: update things" -m "BREAKING CHANGE: removed api"
      - id: action
        uses: .
        with:
          tag_prefix: tbodyv
          search_commit_body: "true"
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
          VERSION_TYPE: ${{ steps.action.outputs.version_type }}
        run: |
          echo "version=$VERSION type=$VERSION_TYPE"
          [ "$VERSION" = "2.0.0" ] || { echo "FAIL: version expected 2.0.0"; exit 1; }
          [ "$VERSION_TYPE" = "major" ] || { echo "FAIL: version_type expected major"; exit 1; }
          echo "PASS"
