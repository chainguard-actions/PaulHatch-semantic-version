name: Test HEAD already tagged
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Tag HEAD
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git commit --allow-empty -m "fix: something"
          git tag -a ttaggedv3.4.5 -m "release" HEAD
      - id: action
        uses: .
        with:
          tag_prefix: ttaggedv
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
          IS_TAGGED: ${{ steps.action.outputs.is_tagged }}
        run: |
          echo "version=$VERSION is_tagged=$IS_TAGGED"
          [ "$IS_TAGGED" = "true" ] || { echo "FAIL: is_tagged expected true"; exit 1; }
          [ "$VERSION" = "3.4.5" ] || { echo "FAIL: version expected 3.4.5"; exit 1; }
          echo "PASS"
