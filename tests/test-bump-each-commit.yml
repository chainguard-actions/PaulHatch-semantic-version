name: Test bump_each_commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create base tag and three commits
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag -a tbumpv1.2.3 -m "base" HEAD
          git commit --allow-empty -m "fix: one"
          git commit --allow-empty -m "fix: two"
          git commit --allow-empty -m "fix: three"
      - id: action
        uses: .
        with:
          tag_prefix: tbumpv
          bump_each_commit: "true"
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
          VERSION_TYPE: ${{ steps.action.outputs.version_type }}
        run: |
          echo "version=$VERSION type=$VERSION_TYPE"
          [ "$VERSION" = "1.2.6" ] || { echo "FAIL: version expected 1.2.6"; exit 1; }
          [ "$VERSION_TYPE" = "patch" ] || { echo "FAIL: version_type expected patch"; exit 1; }
          echo "PASS"
